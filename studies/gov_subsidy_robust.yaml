name: gov-subsidy-robust
data:
  panel: D:/gov-subsidy-stock-paper/data/analysis_sample.csv
  code_col: sec_code
sample:
  derive:
    - name: disclosed_asset
      expr: "disclosed_class == 'asset'"
tests:
  - group_diff: {var: car_m3_3, by: disclosed_asset, id: base_3d}
  - group_diff: {var: car_m3_3, by: disclosed_asset, id: winsor_3d, winsor: [0.01, 0.99]}
  - group_diff: {var: car_m3_3, by: disclosed_asset, id: ex_bigcap, drop_where: "size > 25"}
  - group_diff: {var: car_m3_3, by: disclosed_asset, id: winsor_ex_big, winsor: [0.01, 0.99], drop_where: "size > 25"}
output_dir: examples/gov-subsidy/output_robust
